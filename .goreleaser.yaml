# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: knit

before:
  hooks:
    # Build knit.1 from man/knit.md, which inlines docs/knit.md. The
    # tools/replace program resolves the {{ read "..." }} template.
    - sh -c 'go run tools/replace/replace.go man/knit.md | pandoc -s -t man -o knit.1'

builds:
  - id: knit
    main: ./cmd/knit
    binary: knit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/zyedidia/knit/info.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
      - openbsd
      - freebsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: openbsd
        goarch: "386"
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: arm64
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64

archives:
  - id: knit
    formats: [tar.gz]
    name_template: "knit-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - LICENSE-EXTRA
      - README.md
      - knit.1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge "
      - "^chore:"

checksum:
  name_template: checksums.txt

release:
  name_template: "v{{ .Version }}"
  github:
    owner: mtmn
    name: knit
  draft: false
  prerelease: auto
